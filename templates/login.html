{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<div class="hero">
  <svg class="hero-mark" viewBox="4 2 56 56" width="76" height="76" aria-hidden="true">
    <rect x="6" y="44" width="14" height="12" rx="3" style="fill: var(--primary)"/>
    <rect x="25" y="30" width="14" height="26" rx="3" style="fill: var(--primary)"/>
    <rect x="44" y="14" width="14" height="42" rx="3" style="fill: var(--primary)"/>
    <circle cx="51" cy="6" r="3.5" style="fill: var(--primary)"/>
  </svg>
  <h1>티원</h1>
  <p class="muted">티끌 모아 원 · 사기 전에 물어보는 AI 절약 상담</p>
</div>

<div class="card">
  <div class="tabs">
    <button class="tab active" type="button" data-mode="login">로그인</button>
    <button class="tab" type="button" data-mode="signup">회원가입</button>
  </div>
  <form id="auth-form" class="stack" novalidate>
    <div class="field">
      <label for="username">아이디</label>
      <input class="input" id="username" name="username" autocomplete="username" required>
      <span class="help" id="username-help" hidden>영문 소문자·숫자·밑줄(_) 4~20자</span>
    </div>
    <div class="field">
      <label for="password">비밀번호</label>
      <input class="input" id="password" name="password" type="password"
             autocomplete="current-password" required>
      <span class="help" id="password-help" hidden>8~64자</span>
    </div>
    <div class="field" id="confirm-field" hidden>
      <label for="password_confirm">비밀번호 확인</label>
      <input class="input" id="password_confirm" name="password_confirm" type="password"
             autocomplete="new-password">
      <span class="help" id="confirm-status" aria-live="polite"></span>
    </div>
    <div class="alert-error" id="auth-error" role="alert" hidden></div>
    <button class="btn btn-primary btn-lg btn-block" id="auth-submit" type="submit">로그인</button>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script>
  let mode = "login";
  const form = document.getElementById("auth-form");
  const submit = document.getElementById("auth-submit");
  const errorBox = document.getElementById("auth-error");

  document.querySelectorAll("[data-mode]").forEach((tab) => {
    tab.addEventListener("click", () => {
      mode = tab.dataset.mode;
      document.querySelectorAll("[data-mode]").forEach((t) => t.classList.toggle("active", t === tab));
      const isSignup = mode === "signup";
      submit.textContent = isSignup ? "회원가입" : "로그인";
      document.getElementById("username-help").hidden = !isSignup;
      document.getElementById("password-help").hidden = !isSignup;
      document.getElementById("password").autocomplete = isSignup ? "new-password" : "current-password";
      document.getElementById("confirm-field").hidden = !isSignup;
      errorBox.hidden = true;
    });
  });

  // 비밀번호 확인: 입력할 때마다 일치 여부 표시
  const confirmStatus = document.getElementById("confirm-status");
  function updateConfirm() {
    const confirm = form.password_confirm.value;
    if (!confirm) {
      confirmStatus.textContent = "";
      return;
    }
    const same = confirm === form.password.value;
    confirmStatus.textContent = same ? "✓ 비밀번호가 일치해요" : "비밀번호가 일치하지 않아요";
    confirmStatus.className = "help " + (same ? "ok" : "danger");
  }
  form.password.addEventListener("input", updateConfirm);
  form.password_confirm.addEventListener("input", updateConfirm);

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    errorBox.hidden = true;
    if (mode === "signup" && form.password.value !== form.password_confirm.value) {
      errorBox.textContent = "비밀번호가 일치하지 않아요.";
      errorBox.hidden = false;
      form.password_confirm.focus();
      return;
    }
    submit.disabled = true;
    const body = {
      username: form.username.value,
      password: form.password.value,
    };
    if (mode === "signup") body.password_confirm = form.password_confirm.value;
    const result = await apiRequest("POST", "/api/auth/" + mode, body);
    submit.disabled = false;
    if (result.ok) {
      window.location.href = "/";
    } else {
      errorBox.textContent = result.message;
      errorBox.hidden = false;
    }
  });
</script>
{% endblock %}
